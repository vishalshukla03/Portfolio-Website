<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Gradient -->
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    
    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Optional Sleek Dark Background (Remove this <rect> if you want a transparent background) -->
  <rect width="200" height="200" rx="36" fill="#0B0F19" />
  
  <!-- Geometric Letter V -->
  <path d="M 50 50 L 100 140 L 150 50 L 125 50 L 100 105 L 75 50 Z" 
        fill="url(#vGradient)" 
        filter="url(#subtleGlow)" />
</svg>
